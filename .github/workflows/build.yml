name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-go:
    name: Build Go Backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        cache: false
    
    - name: Build
      working-directory: ./backend
      run: |
        go mod tidy
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o anchor-finance-server ./cmd/server/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: go-server
        path: backend/anchor-finance-server

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.sha }}
        name: Build ${{ github.sha }}
        files: backend/anchor-finance-server
        body: |
          Commit: ${{ github.sha }}
          Message: ${{ github.event.head_commit.message }}

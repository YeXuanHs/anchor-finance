# 锚点财务系统配置文件
# 复制此文件为 config.yaml 并修改配置

# 服务器配置
server:
  port: 8080
  mode: debug  # debug, release, test

# PostgreSQL 数据库配置
database:
  host: localhost
  port: 5432
  user: anchor_finance
  password: your_password_here
  dbname: anchor_finance
  sslmode: disable
  timezone: Asia/Shanghai

# Redis 配置
redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

# 日志配置
log:
  level: info      # debug, info, warn, error, fatal
  format: json     # json, text
  output: stdout   # stdout, file
  file: ./logs/app.log

# JWT 配置
jwt:
  secret: your_jwt_secret_key_here_change_in_production
  expire_hour: 72

# 邮件配置
email:
  host: smtp.example.com
  port: 465
  username: noreply@example.com
  password: your_email_password
  from: "锚点财务 <noreply@example.com>"

# 短信配置
sms:
  provider: aliyun  # aliyun, tencent
  api_key: your_api_key
  params:
    sign_name: 锚点财务
    template_code: SMS_123456

# 支付网关配置
payment:
  # 支付宝
  alipay:
    app_id: your_alipay_app_id
    private_key: |
      -----BEGIN RSA PRIVATE KEY-----
      your_private_key_here
      -----END RSA PRIVATE KEY-----
    public_key: |
      -----BEGIN PUBLIC KEY-----
      your_public_key_here
      -----END PUBLIC KEY-----
    notify_url: https://your-domain.com/api/payment/alipay/notify

  # 微信支付
  wechat:
    app_id: your_wechat_app_id
    mch_id: your_merchant_id
    api_key: your_wechat_api_key
    notify_url: https://your-domain.com/api/payment/wechat/notify

  # 余额支付
  balance:
    enabled: true

# 定时任务配置
job:
  auto_renew_cron: "0 2 * * *"     # 每天凌晨2点检查自动续费
  invoice_check: "0 */1 * * *"     # 每小时检查账单状态
  product_status_check: "0 */1 * * *"  # 每小时检查产品状态

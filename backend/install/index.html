<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锚点财务 - 系统安装</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .installer-container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 720px;
            overflow: hidden;
        }

        .installer-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            padding: 32px;
            text-align: center;
        }

        .installer-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .installer-header p {
            font-size: 14px;
            opacity: 0.85;
        }

        .steps-bar {
            display: flex;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 0;
        }

        .step-item {
            flex: 1;
            text-align: center;
            padding: 16px 8px;
            font-size: 13px;
            color: #94a3b8;
            position: relative;
            font-weight: 500;
            transition: all 0.3s;
        }

        .step-item.active {
            color: #4f46e5;
            background: #eef2ff;
            font-weight: 600;
        }

        .step-item.done {
            color: #10b981;
            background: #f0fdf4;
        }

        .step-item .step-num {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #94a3b8;
            font-size: 12px;
            margin-right: 6px;
            font-weight: 600;
        }

        .step-item.active .step-num {
            background: #4f46e5;
            color: #fff;
        }

        .step-item.done .step-num {
            background: #10b981;
            color: #fff;
        }

        .installer-body {
            padding: 32px;
        }

        .step-content {
            display: none;
        }

        .step-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .env-check-list {
            list-style: none;
        }

        .env-check-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .env-check-list li .check-label {
            font-weight: 500;
            color: #374151;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.checking {
            background: #fef3c7;
            color: #d97706;
        }

        .status-badge.success {
            background: #d1fae5;
            color: #059669;
        }

        .status-badge.error {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-row {
            display: flex;
            justify-content: space-between;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
        }

        .btn {
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
        }

        .btn-primary:hover {
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .alert-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .success-panel {
            text-align: center;
            padding: 20px 0;
        }

        .success-panel .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .success-panel h2 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 12px;
        }

        .success-panel p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
        }

        .success-panel .btn-group {
            margin-top: 28px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .test-btn {
            padding: 6px 16px;
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .test-btn:hover {
            background: #dcfce7;
        }

        .config-preview {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            font-family: "Fira Code", "Consolas", monospace;
            font-size: 12px;
            line-height: 1.6;
            overflow-x: auto;
            margin-top: 12px;
            text-align: left;
            max-height: 240px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="installer-container">
        <div class="installer-header">
            <h1>锚点财务 AnchorFinance</h1>
            <p>系统安装向导</p>
        </div>

        <div class="steps-bar">
            <div class="step-item active" data-step="1">
                <span class="step-num">1</span>环境检测
            </div>
            <div class="step-item" data-step="2">
                <span class="step-num">2</span>数据库配置
            </div>
            <div class="step-item" data-step="3">
                <span class="step-num">3</span>管理员设置
            </div>
            <div class="step-item" data-step="4">
                <span class="step-num">4</span>安装完成
            </div>
        </div>

        <div class="installer-body">
            <div class="alert alert-error" id="alertError"></div>

            <!-- Step 1: 环境检测 -->
            <div class="step-content active" id="step1">
                <h3 style="margin-bottom: 16px; color: #1e293b;">环境检测</h3>
                <p style="color: #64748b; font-size: 13px; margin-bottom: 20px;">正在检测运行环境是否满足安装要求...</p>
                <ul class="env-check-list">
                    <li>
                        <span class="check-label">Go 运行环境</span>
                        <span class="status-badge checking" id="checkGo">检测中...</span>
                    </li>
                    <li>
                        <span class="check-label">PostgreSQL 数据库</span>
                        <span class="status-badge checking" id="checkPg">检测中...</span>
                    </li>
                    <li>
                        <span class="check-label">Redis 缓存服务</span>
                        <span class="status-badge checking" id="checkRedis">检测中...</span>
                    </li>
                </ul>
                <div class="btn-row">
                    <div></div>
                    <button class="btn btn-primary" id="btnStep1Next" disabled>下一步</button>
                </div>
            </div>

            <!-- Step 2: 数据库配置 -->
            <div class="step-content" id="step2">
                <h3 style="margin-bottom: 16px; color: #1e293b;">数据库配置</h3>
                <p style="color: #64748b; font-size: 13px; margin-bottom: 20px;">请填写 PostgreSQL 数据库连接信息。</p>
                <div class="form-row">
                    <div class="form-group">
                        <label>数据库主机</label>
                        <input type="text" id="dbHost" value="127.0.0.1" placeholder="127.0.0.1">
                    </div>
                    <div class="form-group">
                        <label>端口</label>
                        <input type="text" id="dbPort" value="5432" placeholder="5432">
                    </div>
                </div>
                <div class="form-group">
                    <label>数据库用户名</label>
                    <input type="text" id="dbUser" value="postgres" placeholder="postgres">
                </div>
                <div class="form-group">
                    <label>数据库密码</label>
                    <input type="password" id="dbPassword" placeholder="请输入数据库密码">
                </div>
                <div class="form-group">
                    <label>数据库名称</label>
                    <input type="text" id="dbName" value="anchor_finance" placeholder="anchor_finance">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Redis 主机</label>
                        <input type="text" id="redisHost" value="127.0.0.1" placeholder="127.0.0.1">
                    </div>
                    <div class="form-group">
                        <label>Redis 端口</label>
                        <input type="text" id="redisPort" value="6379" placeholder="6379">
                    </div>
                </div>
                <div class="form-group">
                    <label>Redis 密码（可选）</label>
                    <input type="password" id="redisPassword" placeholder="无密码请留空">
                </div>
                <div class="btn-row">
                    <button class="btn btn-secondary" onclick="goStep(1)">上一步</button>
                    <button class="btn btn-primary" onclick="testDBConnection()">测试连接并下一步</button>
                </div>
            </div>

            <!-- Step 3: 管理员设置 -->
            <div class="step-content" id="step3">
                <h3 style="margin-bottom: 16px; color: #1e293b;">管理员设置</h3>
                <p style="color: #64748b; font-size: 13px; margin-bottom: 20px;">设置系统管理员账号信息。</p>
                <div class="form-group">
                    <label>管理员用户名</label>
                    <input type="text" id="adminUser" value="admin" placeholder="admin">
                </div>
                <div class="form-group">
                    <label>管理员密码</label>
                    <input type="password" id="adminPassword" placeholder="请输入管理员密码（至少6位）">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="adminPasswordConfirm" placeholder="请再次输入密码">
                </div>
                <div class="form-group">
                    <label>管理员邮箱</label>
                    <input type="email" id="adminEmail" placeholder="admin@example.com">
                </div>
                <div class="btn-row">
                    <button class="btn btn-secondary" onclick="goStep(2)">上一步</button>
                    <button class="btn btn-primary" id="btnInstall" onclick="doInstall()">开始安装</button>
                </div>
            </div>

            <!-- Step 4: 安装完成 -->
            <div class="step-content" id="step4">
                <div class="success-panel">
                    <div class="icon">&#10003;</div>
                    <h2>安装成功！</h2>
                    <p>锚点财务系统已成功安装。<br>配置文件已生成至 <code>configs/config.yaml</code></p>
                    <div class="config-preview" id="configPreview"></div>
                    <div class="btn-group">
                        <a href="/admin" class="btn btn-primary">进入管理后台</a>
                        <a href="/" class="btn btn-secondary">访问前台</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        let envOk = false;

        function goStep(n) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.step-item').forEach(el => {
                el.classList.remove('active');
                if (parseInt(el.dataset.step) < n) el.classList.add('done');
            });
            document.getElementById('step' + n).classList.add('active');
            document.querySelector(`.step-item[data-step="${n}"]`).classList.add('active');
            document.querySelector(`.step-item[data-step="${n}"]`).classList.remove('done');
            currentStep = n;
            hideAlert();
        }

        function showAlert(msg, type) {
            const el = document.getElementById('alertError');
            el.textContent = msg;
            el.className = 'alert alert-' + (type || 'error');
            el.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alertError').style.display = 'none';
        }

        async function checkEnv() {
            const checks = [
                { id: 'checkGo', url: '/api/install/check-env?type=go' },
                { id: 'checkPg', url: '/api/install/check-env?type=pg' },
                { id: 'checkRedis', url: '/api/install/check-env?type=redis' }
            ];

            let allOk = true;
            for (const c of checks) {
                const el = document.getElementById(c.id);
                el.textContent = '检测中...';
                el.className = 'status-badge checking';
                try {
                    const resp = await fetch(c.url);
                    const data = await resp.json();
                    if (data.ok) {
                        el.textContent = data.message || '正常';
                        el.className = 'status-badge success';
                    } else {
                        el.textContent = data.message || '异常';
                        el.className = 'status-badge error';
                        allOk = false;
                    }
                } catch (e) {
                    el.textContent = '无法连接';
                    el.className = 'status-badge error';
                    allOk = false;
                }
            }

            envOk = allOk;
            document.getElementById('btnStep1Next').disabled = !allOk;
            if (!allOk) {
                showAlert('部分环境检测未通过，请检查服务是否正常运行。您仍可继续配置，但建议先解决以上问题。', 'error');
            }
        }

        async function testDBConnection() {
            hideAlert();
            const payload = {
                db_host: document.getElementById('dbHost').value,
                db_port: document.getElementById('dbPort').value,
                db_user: document.getElementById('dbUser').value,
                db_password: document.getElementById('dbPassword').value,
                db_name: document.getElementById('dbName').value,
                redis_host: document.getElementById('redisHost').value,
                redis_port: document.getElementById('redisPort').value,
                redis_password: document.getElementById('redisPassword').value,
                test_only: true
            };

            try {
                const resp = await fetch('/api/install/test-db', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                if (data.ok) {
                    goStep(3);
                } else {
                    showAlert(data.message || '数据库连接失败，请检查配置。');
                }
            } catch (e) {
                showAlert('请求失败：' + e.message);
            }
        }

        async function doInstall() {
            hideAlert();
            const pwd = document.getElementById('adminPassword').value;
            const pwd2 = document.getElementById('adminPasswordConfirm').value;
            const email = document.getElementById('adminEmail').value;
            const username = document.getElementById('adminUser').value;

            if (!username || username.length < 3) {
                showAlert('管理员用户名至少3个字符');
                return;
            }
            if (!pwd || pwd.length < 6) {
                showAlert('管理员密码至少6位');
                return;
            }
            if (pwd !== pwd2) {
                showAlert('两次输入的密码不一致');
                return;
            }
            if (!email || !email.includes('@')) {
                showAlert('请输入有效的邮箱地址');
                return;
            }

            const btn = document.getElementById('btnInstall');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>正在安装...';

            const payload = {
                db_host: document.getElementById('dbHost').value,
                db_port: document.getElementById('dbPort').value,
                db_user: document.getElementById('dbUser').value,
                db_password: document.getElementById('dbPassword').value,
                db_name: document.getElementById('dbName').value,
                redis_host: document.getElementById('redisHost').value,
                redis_port: document.getElementById('redisPort').value,
                redis_password: document.getElementById('redisPassword').value,
                admin_username: username,
                admin_password: pwd,
                admin_email: email
            };

            try {
                const resp = await fetch('/api/install', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                if (data.ok) {
                    document.getElementById('configPreview').textContent = data.config_preview || '# configs/config.yaml 已生成';
                    goStep(4);
                } else {
                    showAlert(data.message || '安装失败，请查看日志。');
                    btn.disabled = false;
                    btn.textContent = '开始安装';
                }
            } catch (e) {
                showAlert('请求失败：' + e.message);
                btn.disabled = false;
                btn.textContent = '开始安装';
            }
        }

        document.getElementById('btnStep1Next').addEventListener('click', function () {
            goStep(2);
        });

        checkEnv();
    </script>
</body>
</html>

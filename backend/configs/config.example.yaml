# 锚点财务 配置文件示例
# 复制此文件为 config.yaml 并修改配置

server:
  port: 8080
  mode: debug  # debug, release, test

database:
  host: localhost
  port: 5432
  user: anchorfinance
  password: your_password_here
  dbname: anchorfinance
  sslmode: disable
  timezone: Asia/Shanghai

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

log:
  level: info  # debug, info, warn, error
  format: json  # json, text
  output: stdout  # stdout, file
  file: logs/app.log

jwt:
  secret: your_jwt_secret_here_change_it
  expire_hour: 72

email:
  host: smtp.example.com
  port: 465
  username: noreply@example.com
  password: your_email_password
  from: noreply@example.com

sms:
  provider: aliyun  # aliyun, tencent
  api_key: your_api_key
  params:
    sign_name: 锚点财务
    template_code: SMS_000000

payment:
  alipay:
    app_id: ""
    private_key: ""
    public_key: ""
    notify_url: "https://yourdomain.com/api/v2/payments/alipay/notify"
  wechat:
    app_id: ""
    mch_id: ""
    api_key: ""
    notify_url: "https://yourdomain.com/api/v2/payments/wechat/notify"
  balance:
    enabled: true

job:
  auto_renew_cron: "0 3 * * *"  # 每天凌晨3点
  invoice_check: "0 */1 * * *"  # 每小时

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>锚点财务API文档</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <button class="hamburger" id="hamburger" aria-label="Toggle menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
  <a class="brand" href="index.html?page=public">锚点财务API文档</a>
  <div class="nav-links" id="navLinks">
    <a href="index.html?page=public" data-page="public">公共接口</a>
    <a href="index.html?page=user" data-page="user">用户接口</a>
    <a href="index.html?page=admin" data-page="admin">管理接口</a>
  </div>
  <div class="search-box">
    <input type="text" id="apiSearch" placeholder="搜索API... (Ctrl+K)" autocomplete="off">
    <span class="search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
    <div class="search-results" id="searchResults"></div>
  </div>
</nav>

<div class="side-nav" id="sidebar"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="side-content"><div class="doc-content" id="content"></div></div>

<script src="api_data.js"></script>
<script>
// ========== API Data loaded from api_data.js ==========


// ========== Mobile Menu ==========
function initMobileMenu() {
  var hamburger = document.getElementById('hamburger');
  var sidebar = document.querySelector('.side-nav');
  var overlay = document.getElementById('sidebarOverlay');
  if (!hamburger || !sidebar || !overlay) return;

  hamburger.onclick = function() {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  };
  overlay.onclick = function() {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  };
  // Close sidebar when clicking a link on mobile
  sidebar.querySelectorAll('a[href]').forEach(function(a) {
    a.addEventListener('click', function() {
      if (window.innerWidth < 768) {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
      }
    });
  });
}

// ========== Render ==========
function getParam(key) {
  return new URLSearchParams(window.location.search).get(key);
}

function getPage() { return getParam('page') || 'public'; }
function getApi() { return getParam('api') || ''; }

// Find first API id for a page
function getFirstApiId(page) {
  var data = API_DATA[page];
  if (data && data.groups.length > 0 && data.groups[0].items.length > 0) {
    return data.groups[0].items[0].id;
  }
  return '';
}

// Find an API item by id
function findApiItem(page, apiId) {
  var data = API_DATA[page];
  if (!data) return null;
  for (var g = 0; g < data.groups.length; g++) {
    for (var i = 0; i < data.groups[g].items.length; i++) {
      if (data.groups[g].items[i].id === apiId) {
        return { item: data.groups[g].items[i], group: data.groups[g] };
      }
    }
  }
  return null;
}

function render() {
  var page = getPage();
  var apiId = getApi();
  var data = API_DATA[page];
  if (!data) { data = API_DATA.public; page = 'public'; }

  // If no api selected, default to first
  if (!apiId) {
    apiId = getFirstApiId(page);
    if (apiId) {
      window.location.replace('index.html?page=' + page + '&api=' + apiId);
      return;
    }
  }

  var found = findApiItem(page, apiId);
  if (!found) {
    apiId = getFirstApiId(page);
    found = findApiItem(page, apiId);
    if (!found) return;
  }
  var currentItem = found.item;
  var currentGroup = found.group;

  // Update nav active state
  document.querySelectorAll('#navLinks a').forEach(function(a) {
    a.classList.toggle('active', a.getAttribute('data-page') === page);
  });

  // Render sidebar
  var sidebarHtml = '';
  // Page switch links (always in sidebar, hidden on desktop via CSS)
  sidebarHtml += '<div class="sidebar-page-nav">';
  sidebarHtml += '<a href="index.html?page=public"' + (page==='public'?' class="active"':'') + '>公共接口</a>';
  sidebarHtml += '<a href="index.html?page=user"' + (page==='user'?' class="active"':'') + '>用户接口</a>';
  sidebarHtml += '<a href="index.html?page=admin"' + (page==='admin'?' class="active"':'') + '>管理接口</a>';
  sidebarHtml += '</div>';
  sidebarHtml += '<div class="panel-group">';
  data.groups.forEach(function(group) {
    var isActiveGroup = group.name === currentGroup.name;
    sidebarHtml += '<div class="panel-heading">';
    sidebarHtml += '<a class="side-nav-item item-title">' + group.name + '</a>';
    sidebarHtml += '<div class="panel-collapse' + (isActiveGroup ? ' show' : '') + '">';
    sidebarHtml += '<div class="item-body"><ul class="list-unstyled">';
    group.items.forEach(function(item) {
      var isActive = item.id === apiId;
      sidebarHtml += '<li><a href="index.html?page=' + page + '&api=' + item.id + '"' + (isActive ? ' class="active"' : '') + '>' + item.title + '</a></li>';
    });
    sidebarHtml += '</ul></div></div></div>';
  });
  sidebarHtml += '</div>';
  document.getElementById('sidebar').innerHTML = sidebarHtml;

  // Render single API content
  var item = currentItem;
  var contentHtml = '<h2 class="class-title">' + currentGroup.name + '</h2>';
  contentHtml += '<div class="action-item">';
  contentHtml += '<div class="table-item">';
  contentHtml += '<h4 class="action-title">API - ' + item.title + '</h4>';
  contentHtml += '<p>描述：' + item.desc + '</p>';
  if (item.method) contentHtml += '<p>请求方式：<span class="method-badge method-' + item.method.toLowerCase() + '">' + item.method + '</span></p>';
  if (item.url) contentHtml += '<p>请求地址：<span>' + item.url + '</span></p>';
  contentHtml += '<p>版本：v1</p>';
  contentHtml += '</div>';

  if (item.reqParams && item.reqParams.length > 0) {
    contentHtml += '<div class="table-item"><p class="table-title"><span class="badge badge-danger">请求参数</span></p>';
    contentHtml += '<table class="table"><tbody>';
    contentHtml += '<tr><td width="160">参数</td><td width="70">类型</td><td width="100">验证规则</td><td>描述</td><td>示例</td></tr>';
    item.reqParams.forEach(function(p) {
      contentHtml += '<tr><td>' + p.n + '</td><td>' + p.t + '</td><td>' + p.r + '</td><td>' + p.d + '</td><td>' + p.e + '</td></tr>';
    });
    contentHtml += '</tbody></table></div>';
  }

  if (item.resParams && item.resParams.length > 0) {
    contentHtml += '<div class="table-item"><p class="table-title"><span class="badge badge-success">返回参数</span></p>';
    contentHtml += '<table class="table"><tbody>';
    contentHtml += '<tr><td width="160">参数</td><td width="70">类型</td><td>描述</td><td>示例</td></tr>';
    item.resParams.forEach(function(p) {
      contentHtml += '<tr><td>' + p.n + '</td><td>' + p.t + '</td><td>' + p.d + '</td><td>' + p.e + '</td></tr>';
    });
    contentHtml += '</tbody></table></div>';
  }

  if (item.reqExample) {
    contentHtml += '<div class="table-item"><p class="table-title"><span class="badge badge-info">请求示例</span></p>';
    contentHtml += '<pre>' + escapeHtml(item.reqExample) + '</pre></div>';
  }

  if (item.resExample) {
    contentHtml += '<div class="table-item"><p class="table-title"><span class="badge badge-info">返回示例</span></p>';
    contentHtml += '<pre>' + escapeHtml(item.resExample) + '</pre></div>';
  }

  contentHtml += '</div>';

  document.getElementById('content').innerHTML = contentHtml;

  // Re-init
  initSidebar();
  initSearch();
  initMobileMenu();
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function initSidebar() {
  document.querySelectorAll('.item-title').forEach(function(el) {
    el.addEventListener('click', function() {
      var panel = this.closest('.panel-heading');
      var collapse = panel.querySelector('.panel-collapse');
      collapse.classList.toggle('show');
    });
  });
}

function initSearch() {
  var searchInput = document.getElementById('apiSearch');
  var searchResults = document.getElementById('searchResults');
  if (!searchInput || !searchResults) return;

  // Build index across ALL pages
  var index = [];
  var pageNames = {public:'公共接口', user:'用户接口', admin:'管理接口'};
  ['public','user','admin'].forEach(function(pg) {
    var data = API_DATA[pg];
    if (!data) return;
    data.groups.forEach(function(group) {
      group.items.forEach(function(item) {
        var paramNames = '';
        if (item.reqParams) paramNames += item.reqParams.map(function(p){return p.n}).join(' ');
        if (item.resParams) paramNames += ' ' + item.resParams.map(function(p){return p.n}).join(' ');
        index.push({
          title: item.title,
          method: item.method,
          url: item.url,
          desc: item.desc,
          params: paramNames,
          id: item.id,
          page: pg,
          pageName: pageNames[pg] || pg,
          groupName: group.name
        });
      });
    });
  });

  searchInput.oninput = function() {
    var q = this.value.trim().toLowerCase();
    if (!q) { searchResults.classList.remove('show'); return; }
    var matches = index.filter(function(item) {
      return (item.title + ' ' + item.url + ' ' + item.params + ' ' + item.desc).toLowerCase().includes(q);
    });
    if (matches.length === 0) {
      searchResults.innerHTML = '<div class="no-result">没有找到匹配的API (´;ω;`)</div>';
    } else {
      var html = '';
      matches.slice(0, 20).forEach(function(m) {
        var mc = m.method ? 'method-' + m.method.toLowerCase() : 'method-empty';
        var hl = function(s) { return q ? s.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi'),'<span class="result-highlight">$1</span>') : s; };
        html += '<div class="result-item" data-page="' + m.page + '" data-id="' + m.id + '">';
        html += '<span class="result-method ' + mc + '">' + (m.method || '') + '</span>';
        html += '<span class="result-name">' + hl(m.title) + '</span>';
        html += '<span class="result-tag">' + m.pageName + '</span>';
        html += '<div class="result-path">' + hl(m.url) + '</div>';
        html += '</div>';
      });
      searchResults.innerHTML = html;
    }
    searchResults.classList.add('show');

    searchResults.querySelectorAll('.result-item').forEach(function(ri) {
      ri.onclick = function() {
        var pg = this.getAttribute('data-page');
        var apiId = this.getAttribute('data-id');
        window.location.href = 'index.html?page=' + pg + '&api=' + apiId;
      };
    });
  };

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-box')) searchResults.classList.remove('show');
  });

  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey||e.metaKey) && e.key==='k') { e.preventDefault(); searchInput.focus(); }
    if (e.key==='Escape') { searchResults.classList.remove('show'); searchInput.blur(); }
  });
}

function initScroll() {
  // Smooth scroll
  document.querySelectorAll('a[href^="#"]').forEach(function(a) {
    a.addEventListener('click', function(e) {
      var href = this.getAttribute('href');
      if (href.startsWith('#')) {
        var target = document.querySelector(href);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({behavior:'smooth',block:'start'});
        }
      }
    });
  });

  // Active link tracking
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var id = entry.target.id;
        document.querySelectorAll('.item-body a').forEach(function(a) {
          a.classList.remove('active');
          if (a.getAttribute('href') === '#' + id) a.classList.add('active');
        });
      }
    });
  }, {threshold:0.3,rootMargin:'-60px 0px -60% 0px'});

  document.querySelectorAll('.action-item[id]').forEach(function(item) {
    observer.observe(item);
  });
}

// ========== Flash Animation ==========
var s = document.createElement('style');
s.textContent = '@keyframes flash{0%{box-shadow:0 0 0 0 rgba(255,107,157,0.6)}50%{box-shadow:0 0 0 8px rgba(255,107,157,0)}100%{box-shadow:none}}';
document.head.appendChild(s);

// ========== Init ==========
render();
</script>
</body>
</html>
